<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='/manifest.json'><link rel='icon' href='/icon-192.png'><link rel='apple-touch-icon' href='/icon-192.png'><link rel='stylesheet' href='style.css'><title>Meu Treino</title></head><body><header><div><small>HIPERTROFIA</small><h1>Meu Treino</h1></div><button id='installBtn' class='ghost' hidden>Instalar</button></header><main>
<section id='home' class='page active'><div class='hero'><p>Bem-vindo de volta</p><h2 id='nextWorkout'>Treino A</h2><p id='nextDesc'>Peito e tríceps</p><button class='primary' onclick="startWorkout()">COMEÇAR TREINO</button></div><div class='grid' id='workoutCards'></div><div class='card'><div class='row'><h3>Peso corporal</h3><strong id='latestWeight'>66,0 kg</strong></div><div class='weight-entry'><input id='weightInput' type='number' step='0.1' placeholder='Ex.: 66.5'><button onclick='addWeight()'>Registrar</button></div><canvas id='weightChart' width='600' height='220'></canvas></div></section>
<section id='workout' class='page'><div class='row'><button class='back' onclick="showPage('home')">←</button><div><small>TREINO ATUAL</small><h2 id='workoutTitle'></h2><p id='workoutDesc'></p></div></div><div id='exerciseList'></div><button class='primary finish' onclick='finishWorkout()'>FINALIZAR TREINO</button></section>
<section id='history' class='page'><h2>Histórico</h2><div id='historyList'></div></section>
</main><nav><button data-page='home' class='active'>⌂<span>Início</span></button><button data-page='workout'>●<span>Treino</span></button><button data-page='history'>▤<span>Histórico</span></button></nav>
<div id='timer' class='timer hidden'><div><small>DESCANSO</small><strong id='timerText'>01:30</strong></div><button onclick='stopTimer()'>Pular</button></div><script src='app.js'></script></body></html>
